<style>
  :root {
    --background: oklch(0.14 0.01 140);
    --foreground: oklch(0.97 0.01 120);
    --brand: oklch(0.88 0.22 128);
    --brand-foreground: oklch(0.14 0.01 140);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  .font-display { font-family: "Anton", Impact, sans-serif; }
  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .grid {
    display: grid;
    gap: 2.5rem;
    max-width: 72rem;
    width: 100%;
    align-items: center;
  }
  @media (min-width: 768px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .col-text { order: 1; }
    .col-img { order: 2; }
  }
  .badge {
    display: inline-block;
    border-radius: 9999px;
    background: var(--brand);
    color: var(--brand-foreground);
    padding: 0.25rem 1rem;
    font-size: 0.875rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 1.5rem;
    font-size: 3.75rem;
    line-height: 1;
    text-transform: uppercase;
  }
  @media (min-width: 768px) { h1 { font-size: 6rem; } }
  h1 .accent { color: var(--brand); }
  .lead { margin-top: 1.5rem; font-size: 1.125rem; opacity: 0.8; }
  .cta {
    margin-top: 2rem;
    display: inline-block;
    border-radius: 0.5rem;
    background: var(--brand);
    color: var(--brand-foreground);
    padding: 1.25rem 2.5rem;
    font-size: 1.5rem;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 0 40px -5px var(--brand);
    transition: transform 0.15s ease;
  }
  .cta:hover { transform: scale(1.05); }
  .note { margin-top: 0.75rem; font-size: 0.875rem; opacity: 0.6; }
  .img-wrap { position: relative; }
  .img-wrap img {
    width: 100%;
    border-radius: 1rem;
    border: 2px solid var(--brand);
    object-fit: cover;
    display: block;
  }
  .tag {
    position: absolute;
    z-index: 10;
    pointer-events: none;
    border-radius: 0.375rem;
    border: 2px solid var(--brand);
    background: color-mix(in oklab, var(--background) 85%, transparent);
    color: var(--brand);
    padding: 0.25rem 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    box-shadow: 0 0 25px -5px var(--brand);
    backdrop-filter: blur(4px);
  }
</style>
